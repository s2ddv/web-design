<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

</head>
<body>
    <header>

    </header>

    <main>

        <video src='./assets/video.mp4' controls width='400' poster='./assets/poster.jpg'>

        <a href='https://www.google.com'>Ir para o Google</a>

        <a href='https://www.google.com'>
        <img src='./assets/images-1.jpeg' alt='imagem clicável' width='100'>

        <ol>

        </ol>
