<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header>

    </header>

    <main>

        <img src='./assets/images-1.jpeg' alt='imagem-1' width="300" height="300">
        <img src='./assets/images-2.jpeg' alt='imagem-2' width="300" height="300">
        <img src='./assets/images-3.jpeg' alt='imagem-3'>

        <video src='./assets/video.mp4' controls width='400' poster='./assets/poster.jpg'>
            Seu navegador não suporta vídeo.
        </video>

        <audio controls>
            <source src='./assets/musica.mp3' type='audio/mpeg'>
            <source src='./assets/musica.ogg' type='audio/ogg'>
            Seu navegador não suporta áudio.
        </audio>

        <form>
            <label for='nome'>Nome:</label>
            <input type='text' id='nome' name='nome' required>
          
            <label for='email'>E-mail:</label>
            <input type='email' id='email' name='email' required>
          
            <label for='mensagem'>Mensagem:</label>
            <textarea id='mensagem' name='mensagem'></textarea>
          
            <button type='submit'>Enviar</button>
          </form>
          
    </main>
</body>
</html>
